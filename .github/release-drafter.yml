name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "Fixes"
    labels:
      - "fix"
      - "bug"
      - "bugfix"
  - title: "Maintenance"
    labels:
      - "chore"
      - "maintenance"
      - "deps"
      - "dependencies"
      - "ci"
      - "refactor"
  - title: "Documentation"
    labels:
      - "docs"
      - "documentation"

version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "patch"
      - "fix"
      - "bug"
      - "bugfix"
      - "chore"
      - "maintenance"
      - "deps"
      - "dependencies"
      - "ci"
      - "docs"
      - "documentation"
  default: patch

exclude-labels:
  - "skip-changelog"
  - "no-changelog"

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/j-pfalzgraf/demodatagen/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
