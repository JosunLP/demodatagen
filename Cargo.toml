[package]
name = "demodatagen"
version = "0.4.0"
edition = "2021"
rust-version = "1.86"
description = "A fast, offline, fully internationalized CLI and library for generating realistic demo files in 33 formats and 10 locales"
license = "MIT"
repository = "https://github.com/josunlp/demodatagen"
readme = "README.md"
keywords = ["demo", "generator", "cli", "test-data", "fake-data"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "demodatagen"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1.1"
quick-xml = { version = "0.31", features = ["serialize"] }
csv = "1"

# Random
rand = "0.8"
rand_chacha = "0.3"

# Parallelism
rayon = "1"

# Image generation
image = "0.25"

# Audio (WAV writing)
hound = "3"

# Archives & compression
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"

# Documents
rust_xlsxwriter = "0.95"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
env_logger = "0.11"
log = "0.4"

# Progress bars & terminal styling / animations
indicatif = { version = "0.17", features = ["rayon"] }
console = "0.15"

# Self-update (rustls instead of native-tls so static musl builds don't need OpenSSL)
self_update = { version = "0.39", optional = true, default-features = false, features = ["rustls", "archive-tar", "archive-zip", "compression-flate2"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
proptest = "1"

[features]
default = ["update"]
update = ["dep:self_update"]

[profile.release]
lto = true
codegen-units = 1
strip = true
