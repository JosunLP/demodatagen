[package]
name = "demodatagen"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
description = "A fast, offline, fully internationalized CLI and library for generating realistic demo files in 33 formats, 10 data locales, and 9 interface languages"
license = "MIT"
repository = "https://github.com/josunlp/demodatagen"
readme = "README.md"
keywords = ["demo", "generator", "cli", "test-data", "fake-data"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "demodatagen"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1.1"
quick-xml = { version = "0.41", features = ["serialize"] }
csv = "1"

# Random
rand = "0.10"
rand_chacha = "0.10"

# Parallelism
rayon = "1"

# Image generation — explicit codec features only. The crate's default feature
# set enables `avif`, which drags in rav1e → ravif → libfuzzer-sys (NCSA license,
# rejected by cargo-deny) and the unmaintained `paste` crate (RUSTSEC-2024-0436).
# We never emit AVIF, so we opt into exactly the codecs we actually write.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "ico",
    "tiff",
    "webp",
] }

# Audio (WAV writing)
hound = "3"

# Archives & compression
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"

# Documents
rust_xlsxwriter = "0.96"

# Error handling
thiserror = "2.0"
anyhow = "1"

# Logging
env_logger = "0.11"
log = "0.4"

# Progress bars & terminal styling / animations
# indicatif >=0.18 drops the unmaintained `number_prefix` (RUSTSEC-2025-0119).
indicatif = { version = "0.18", features = ["rayon"] }
console = "0.16"

# Self-update. We use the lightweight pure-Rust `ureq` backend with rustls+ring
# (no OpenSSL and no aws-lc-rs C build, so static musl builds stay simple) and need
# >=0.44 to get rustls-webpki >=0.103, which patches RUSTSEC-2026-0098/0099/0104.
# In 0.44 the `rustls` feature only *augments* the client (`ureq?/rustls`), so the
# `ureq` backend must be enabled explicitly to get an HTTP client.
self_update = { version = "0.44", optional = true, default-features = false, features = ["ureq", "rustls", "archive-tar", "archive-zip", "compression-flate2"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
proptest = "1"

[features]
default = ["update"]
update = ["dep:self_update"]

[profile.release]
lto = true
codegen-units = 1
strip = true
